server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional static cache control for common assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
